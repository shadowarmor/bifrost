name: Sync upstream Bifrost

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bifrost-upstream-sync
  cancel-in-progress: false

jobs:
  propose-update:
    if: github.repository == 'shadowarmor/bifrost'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Uses only GitHub's API. No checkout or execution of upstream code while
      # holding a write token; no force pushes and no automatic merges.
      - name: Open upstream pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = 'dev';
            const head = 'maximhq:dev';

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`
            });
            if (comparison.ahead_by === 0) {
              core.info('The fork already contains the latest upstream dev commits.');
              return;
            }
            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', base, head
            });
            if (pulls.length) {
              core.info(`Upstream PR already tracks the source branch: ${pulls[0].html_url}`);
              return;
            }
            const { data: pull } = await github.rest.pulls.create({
              owner, repo, base, head,
              // This token cannot grant collaborators access to upstream.
              maintainer_can_modify: false,
              title: 'chore: sync upstream Bifrost dev',
              body: [
                'Bring the latest commits from `maximhq/bifrost:dev` into this fork.',
                '',
                'Review conflicts and CI before merging. Use **Create a merge commit** so upstream ancestry is retained; do not squash or rebase this sync PR.',
                '',
                'Keep the Azure README section, `infra/`, `deploy/`, and fork workflows when resolving conflicts.',
                '',
                'This updates source code only. The Azure image digest remains pinned in `infra/image-lock.json` and no Azure resources are changed.',
                '',
                'PRs created with GITHUB_TOKEN may not start other workflows automatically. Run **Validate Azure deployment → Run workflow** with this PR number to validate the merged result.'
              ].join('\n')
            });
            core.info(`Opened ${pull.html_url}`);
